<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jayden's Life</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141110">
<style>
:root{
  --bg:oklch(0.115 0.008 40); --fg:oklch(0.96 0.006 60); --card:oklch(0.15 0.01 40);
  --raised:oklch(0.175 0.012 40); --primary:oklch(0.72 0.2 45); --muted:oklch(0.195 0.012 40);
  --muted-fg:oklch(0.62 0.018 50); --border:oklch(0.235 0.014 40); --success:oklch(0.72 0.17 152);
  --warning:oklch(0.8 0.15 80);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:ui-sans-serif,-apple-system,'SF Pro Text',system-ui,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));font-size:16px}
header{position:sticky;top:0;z-index:5;background:color-mix(in oklab,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
header .sp{margin-left:auto;font-size:12px;color:var(--muted-fg)}
main{padding:14px 16px 24px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:600;line-height:1.35}
.meta{font-size:12.5px;color:var(--muted-fg);line-height:1.5}
.row{display:flex;gap:12px;align-items:flex-start}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
.tick{width:26px;height:26px;flex:0 0 26px;border:1.5px solid var(--border);border-radius:50%;
  display:grid;place-items:center;color:transparent;transition:.15s}
.tick:active{background:var(--success);border-color:var(--success);color:#000}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;
  background:var(--muted);color:var(--muted-fg);margin-right:5px}
.pill.warn{background:color-mix(in oklab,var(--warning) 22%,transparent);color:var(--warning)}
.pill.due{background:color-mix(in oklab,var(--primary) 22%,transparent);color:var(--primary)}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);
  background:color-mix(in oklab,var(--bg) 94%,transparent);backdrop-filter:blur(16px);
  border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{padding:10px 0 12px;font-size:11px;color:var(--muted-fg);display:grid;gap:3px;justify-items:center}
nav button.on{color:var(--primary)}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;
  border-radius:50%;background:var(--primary);color:#211208;display:grid;place-items:center;
  box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:7;font-size:26px}
.empty{text-align:center;color:var(--muted-fg);padding:56px 20px;font-size:14px;line-height:1.6}
textarea{width:100%;background:var(--raised);border:1px solid var(--border);border-radius:12px;
  color:var(--fg);padding:12px;font:inherit;min-height:110px;resize:none}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end}
.sheet .inner{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:18px 16px
  calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.btn{background:var(--primary);color:#211208;border-radius:12px;padding:13px;width:100%;
  font-weight:620;font-size:15px;margin-top:10px}
.btn.ghost{background:var(--muted);color:var(--fg)}
.banner{background:var(--raised);border:1px solid var(--border);border-radius:12px;padding:12px;
  margin-bottom:12px;font-size:13px;color:var(--muted-fg);line-height:1.5}
.banner b{color:var(--fg);font-weight:600}
.filed{text-align:center;padding:18px 6px}
.filed h3{margin:14px 0 10px;font-size:16px;font-weight:600;line-height:1.4}
.tickbig{width:52px;height:52px;margin:0 auto;border-radius:50%;display:grid;place-items:center;
  background:color-mix(in oklab,var(--success) 20%,transparent);color:var(--success)}
a{color:var(--primary)}

/* lock screen */
body.locked header, body.locked nav, body.locked .fab, body.locked main{display:none}
#lock{display:none;position:fixed;inset:0;z-index:40;background:var(--bg);
  align-items:center;justify-content:center;padding:24px}
.lockbox{width:100%;max-width:330px;text-align:center}
.lockicon{width:58px;height:58px;margin:0 auto 18px;border-radius:50%;
  background:color-mix(in oklab,var(--primary) 18%,transparent);color:var(--primary);
  display:grid;place-items:center}
.lockbox h2{margin:0 0 8px;font-size:20px;font-weight:650;letter-spacing:-.01em}
.lockbox p{margin:0 0 20px;font-size:13.5px;color:var(--muted-fg);line-height:1.55}
.lockbox input{width:100%;background:var(--raised);border:1px solid var(--border);
  border-radius:12px;color:var(--fg);padding:14px;font:inherit;font-size:21px;
  text-align:center;letter-spacing:.32em;margin-bottom:10px}
.lockbox input:focus{outline:none;border-color:var(--primary)}
.lockerr{margin-top:12px;font-size:13px;color:var(--destructive);min-height:18px;line-height:1.45}
#lockbtn{color:var(--muted-fg);display:grid;place-items:center;padding:4px}

/* collapsible to-do groups */
.grp{margin-bottom:14px}
.grphead{display:flex;align-items:center;gap:8px;width:100%;padding:6px 2px 8px;
  font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted-fg)}
.grphead .od{color:var(--destructive)}
.grphead .count{margin-left:auto;font-size:11px;background:var(--muted);
  color:var(--muted-fg);border-radius:999px;padding:1px 8px;letter-spacing:0}
.chev{transition:transform .18s}
.chev.shut{transform:rotate(-90deg)}

/* network toolbar */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.searchwrap{flex:1;display:flex;align-items:center;gap:8px;background:var(--raised);
  border:1px solid var(--border);border-radius:11px;padding:0 11px;color:var(--muted-fg)}
.searchwrap input{flex:1;background:none;border:none;color:var(--fg);font:inherit;
  font-size:14.5px;padding:11px 0;outline:none;min-width:0}
.clearq{color:var(--muted-fg);font-size:19px;padding:0 2px;line-height:1}
.viewtog{width:42px;height:42px;flex:0 0 42px;border:1px solid var(--border);
  border-radius:11px;background:var(--raised);color:var(--muted-fg);display:grid;place-items:center}

.card.tap{cursor:pointer}
.meta.strong{color:var(--fg);font-size:13.5px}
.meta.ig{color:var(--primary)}
.chevr{color:var(--muted-fg);flex:0 0 16px;margin-top:3px}

/* table view */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;
  background:var(--card);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:max-content;min-width:100%;font-size:13.5px}
th{position:sticky;top:0;text-align:left;font-size:11px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted-fg);font-weight:600;
  padding:11px 13px;background:var(--raised);white-space:nowrap}
td{padding:12px 13px;border-top:1px solid var(--border);white-space:nowrap;
  color:var(--muted-fg);max-width:210px;overflow:hidden;text-overflow:ellipsis}
td.nm{color:var(--fg);font-weight:600}
tbody tr:active{background:var(--hover)}

/* person detail */
.inner.tall{max-height:86vh;overflow-y:auto}
.phead{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.phead h2{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em;flex:1}
.closex{font-size:26px;color:var(--muted-fg);line-height:1;padding:0 4px}
.prows{border-top:1px solid var(--border)}
.prow{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.prow .k{flex:0 0 96px;color:var(--muted-fg);font-size:12.5px;padding-top:1px}
.prow .v{flex:1;min-width:0;word-break:break-word}
.tlh{margin:18px 0 8px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted-fg);font-weight:600}
.tl{display:flex;gap:12px;padding:8px 0;font-size:13.5px;line-height:1.5}
.tld{flex:0 0 92px;color:var(--muted-fg);font-size:12.5px}
</style>
</head>
<body>
<div id="lock"></div>
<header>
  <h1 id="title">To-dos</h1>
  <span class="sp" id="sp"></span>
  <button id="lockbtn" aria-label="Devices and code">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round"><rect x="4" y="10" width="16" height="10" rx="2.5"/>
      <path d="M8 10V7a4 4 0 018 0v3"/></svg>
  </button>
</header>
<main id="view"><div class="empty">Loading…</div></main>
<button class="fab" id="fab">+</button>
<nav>
  <button data-tab="todos" class="on"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>To-dos</button>
  <button data-tab="thoughts"><svg viewBox="0 0 24 24"><path d="M12 3a7 7 0 00-4 12.7V19h8v-3.3A7 7 0 0012 3z"/><path d="M10 22h4"/></svg>Thoughts</button>
  <button data-tab="network"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M17 11.5a3 3 0 100-6"/><path d="M18 20h3.5a5.5 5.5 0 00-4-5.3"/></svg>Network</button>
  <button data-tab="inbox"><svg viewBox="0 0 24 24"><path d="M3 13h5l2 3h4l2-3h5"/><path d="M5 5h14l2 8v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5z"/></svg>Inbox</button>
</nav>

<script>
// --- where we are ----------------------------------------------------------
const API = 'https://aezhxtaeelcfnzcitkfe.supabase.co/functions/v1/jl'
const params = new URLSearchParams(location.search)
const SETUP_KEY = params.get('k') || ''            // only used to claim the code once
let TOKEN = localStorage.getItem('jl_device') || ''

// Strip the setup key out of the address bar so it stops living in history.
if (SETUP_KEY) history.replaceState(null, '', location.pathname)

const call = (p, o = {}) => fetch(API + p, {
  ...o,
  headers: {
    'content-type': 'application/json',
    ...(TOKEN ? { 'x-jl-device': TOKEN } : {}),
    ...(o.setup && SETUP_KEY ? { 'x-jl-key': SETUP_KEY } : {}),
    ...(o.headers || {}),
  },
})

let D = { tasks: [], thoughts: [], people: [], captures: [] }
let tab = params.get('tab') || 'todos'
let loaded = false

const $ = id => document.getElementById(id)
const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]))

const fmt = iso => {
  if (!iso) return ''
  // A bare YYYY-MM-DD has no time in it; showing one invents 00:00 and then
  // shifts it by the timezone, which is how "today" became "Today 04:00".
  const dateOnly = /^\d{4}-\d{2}-\d{2}$/.test(iso)
  const d = dateOnly ? new Date(iso + 'T12:00:00') : new Date(iso)
  const now = new Date()
  const day = new Date(d).setHours(0,0,0,0), today = new Date(now).setHours(0,0,0,0)
  const diff = Math.round((day - today) / 86400000)
  const t = dateOnly ? '' : ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
  if (diff === 0) return 'Today' + t
  if (diff === 1) return 'Tomorrow' + t
  if (diff < 0) return Math.abs(diff) === 1 ? 'Yesterday' + t : Math.abs(diff) + 'd ago'
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + t
}

// --- lock screen -----------------------------------------------------------

function showLock({ mode, message }) {
  document.body.classList.add('locked')
  const creating = mode === 'create'
  $('lock').innerHTML =
    '<div class="lockbox">' +
      '<div class="lockicon">' +
        '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.7">' +
        '<rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>' +
      '</div>' +
      '<h2>' + (creating ? 'Choose your code' : "Jayden's Life") + '</h2>' +
      '<p>' + esc(message || (creating
        ? 'Four to twelve digits. You will need it on any new device, and again after a week away.'
        : 'Enter your code to unlock.')) + '</p>' +
      '<input id="code" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" ' +
        'placeholder="••••••" maxlength="12">' +
      (creating ? '<input id="code2" type="password" inputmode="numeric" pattern="[0-9]*" ' +
        'autocomplete="off" placeholder="Repeat it" maxlength="12">' : '') +
      '<button class="btn" id="go">' + (creating ? 'Set code' : 'Unlock') + '</button>' +
      '<div class="lockerr" id="lockerr"></div>' +
    '</div>'
  $('lock').style.display = 'flex'

  const submit = async () => {
    const code = $('code').value.trim()
    const err = m => { $('lockerr').textContent = m }
    if (!/^\d{4,12}$/.test(code)) return err('Digits only, at least four.')
    if (creating && code !== $('code2').value.trim()) return err('The two codes do not match.')
    $('go').textContent = 'Working…'
    try {
      if (creating) {
        const r = await call('/auth/set-code', { method: 'POST', setup: true, body: JSON.stringify({ code }) })
        const j = await r.json()
        if (!r.ok) { $('go').textContent = 'Set code'; return err(j.error || 'Could not set the code.') }
      }
      const r = await call('/auth/unlock', {
        method: 'POST',
        body: JSON.stringify({ code, label: deviceLabel() }),
      })
      const j = await r.json()
      if (!r.ok) {
        $('go').textContent = creating ? 'Set code' : 'Unlock'
        return err(j.error === 'wrong code'
          ? 'Wrong code. ' + (j.attemptsLeft ?? 0) + ' tries left before a 15 minute wait.'
          : (j.error || 'Could not unlock.'))
      }
      TOKEN = j.token
      localStorage.setItem('jl_device', TOKEN)
      $('lock').style.display = 'none'
      document.body.classList.remove('locked')
      boot()
    } catch (e) {
      $('go').textContent = creating ? 'Set code' : 'Unlock'
      err('No connection. Try again.')
    }
  }
  $('go').onclick = submit
  $('code').onkeydown = e => { if (e.key === 'Enter') submit() }
  setTimeout(() => $('code').focus(), 100)
}

function deviceLabel() {
  const ua = navigator.userAgent
  if (/iPhone/.test(ua)) return 'iPhone'
  if (/iPad/.test(ua)) return 'iPad'
  if (/Macintosh/.test(ua)) return 'Mac'
  if (/Android/.test(ua)) return 'Android'
  return 'Browser'
}

function lockOut(reason) {
  TOKEN = ''
  localStorage.removeItem('jl_device')
  const msg = reason === 'idle'
    ? 'A week without opening this, so it locked itself. Enter your code.'
    : reason === 'revoked' ? 'This device was signed out. Enter your code.'
    : 'Enter your code to unlock.'
  showLock({ mode: 'unlock', message: msg })
}

// --- views -----------------------------------------------------------------

const views = {
  todos: () => {
    const groups = groupTasks(D.tasks)
    if (!D.tasks.length)
      return '<div class="empty">Nothing on the list.<br>Say "Hey Siri, Brain Dump".</div>'
    return groups.map(g => {
      const shut = collapsed(g.key)
      return '<section class="grp">' +
        '<button class="grphead" onclick="toggleGroup(\'' + g.key + '\')">' +
          '<svg class="chev' + (shut ? ' shut' : '') + '" viewBox="0 0 24 24" width="15" height="15" ' +
            'fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" ' +
            'stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>' +
          '<span' + (g.key === 'overdue' ? ' class="od"' : '') + '>' + g.label + '</span>' +
          '<span class="count">' + g.items.length + '</span>' +
        '</button>' +
        (shut ? '' : '<div class="grpbody">' + g.items.map(taskCard).join('') + '</div>') +
      '</section>'
    }).join('')
  },

  thoughts: () => D.thoughts.length ? D.thoughts.map(t => `
    <div class="card" onclick="archive('${t.id}')">
      ${t.title ? '<h3>' + esc(t.title) + '</h3>' : ''}
      <div class="meta" style="color:var(--fg);font-size:14.5px">${esc(t.body)}</div>
      <div class="meta" style="margin-top:8px">${fmt(t.created_at)}</div>
    </div>`).join('')
    : '<div class="empty">No thoughts captured yet.<br>Say "Hey Siri, add to my thoughts".</div>',

  network: () => {
    const list = filterPeople(D.people, netQuery)
    const head =
      '<div class="toolbar">' +
        '<div class="searchwrap">' +
          '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" ' +
            'stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>' +
          '<input id="netq" placeholder="Search name, business, place, Instagram…" ' +
            'value="' + esc(netQuery) + '" autocomplete="off">' +
          (netQuery ? '<button class="clearq" onclick="setNetQuery(\'\')">&times;</button>' : '') +
        '</div>' +
        '<button class="viewtog" onclick="toggleNetView()" aria-label="Switch view">' +
          (netView === 'table'
            ? '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" ' +
              'stroke-width="1.9"><rect x="3" y="3" width="7" height="7" rx="1.5"/>' +
              '<rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>' +
              '<rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>'
            : '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" ' +
              'stroke-width="1.9"><path d="M3 6h18M3 12h18M3 18h18"/></svg>') +
        '</button>' +
      '</div>'

    if (!D.people.length)
      return head + '<div class="empty">Nobody yet.<br>Add someone with the + button.</div>'
    if (!list.length)
      return head + '<div class="empty">Nobody matches "' + esc(netQuery) + '".</div>'

    return head + (netView === 'table' ? peopleTable(list) : list.map(personCard).join(''))
  },

  inbox: () => pushBanner() + (D.captures.length ? D.captures.map(c => `
    <div class="card">
      <div class="meta" style="color:var(--fg);font-size:14.5px">${esc(c.raw_text)}</div>
      <div style="margin-top:8px">
        <span class="pill ${c.status === 'filed' ? '' : 'warn'}">${c.status}</span>
        ${c.parsed_type ? '<span class="pill">' + c.parsed_type + '</span>' : ''}
        ${c.parser === 'rules' ? '<span class="pill warn">no AI</span>' : ''}
      </div>
      <div class="meta" style="margin-top:6px">${fmt(c.created_at)}</div>
    </div>`).join('') : '<div class="empty">Nothing captured yet.</div>'),
}

// --- push ------------------------------------------------------------------

const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true

function pushBanner() {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) {
    return '<div class="banner"><b>Reminders need the installed app.</b> Open this from your home ' +
           'screen icon rather than the browser.</div>'
  }
  if (!standalone()) {
    return '<div class="banner"><b>Add this to your home screen first.</b> Tap Share, then ' +
           '"Add to Home Screen", then open it from that icon. iPhones only allow notifications ' +
           'from an installed app.</div>'
  }
  if (Notification.permission === 'denied') {
    return '<div class="banner"><b>Notifications are blocked.</b> Settings &rsaquo; Notifications ' +
           '&rsaquo; Life, and turn on Allow Notifications.</div>'
  }
  if (Notification.permission === 'granted' && localStorage.getItem('jl_pushed') === '1') return ''
  return '<div class="banner"><b>Reminders are off.</b> Turn on notifications so to-dos ' +
    'can chase you.<button class="btn" onclick="enablePush()">Turn on notifications</button></div>'
}

const b64 = s => {
  const p = (s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')
  return Uint8Array.from(atob(p), c => c.charCodeAt(0))
}

async function enablePush() {
  try {
    if (!standalone()) return alert('Open the app from your home screen icon first — iPhones only allow notifications from an installed app.')
    // The key comes from the server; if the last load failed we would otherwise
    // fail with a cryptic error, so fetch it again rather than trusting state.
    if (!D.vapidPublicKey) await load()
    if (!D.vapidPublicKey) return alert('Could not reach the server. Check your connection and try again.')

    const perm = await Notification.requestPermission()
    if (perm !== 'granted') return alert('Notifications were not allowed. You can turn them on in Settings > Notifications > Life.')

    const reg = await navigator.serviceWorker.register('./sw.js')
    await navigator.serviceWorker.ready
    let sub = await reg.pushManager.getSubscription()
    if (!sub) sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64(D.vapidPublicKey),
    })
    const j = sub.toJSON()
    const r = await call('/subscribe', { method: 'POST', body: JSON.stringify({
      endpoint: j.endpoint, keys: j.keys, label: deviceLabel() }) })
    if (!r.ok) throw new Error('server refused the subscription')
    localStorage.setItem('jl_pushed', '1')
    render()
    alert('Reminders are on.')
  } catch (e) {

// --- to-do grouping --------------------------------------------------------

const startOfDay = d => new Date(d).setHours(0, 0, 0, 0)

function groupTasks(tasks) {
  const today = startOfDay(new Date())
  const day = 86400000
  const buckets = {
    overdue:  { key: 'overdue',  label: 'Overdue',   items: [] },
    today:    { key: 'today',    label: 'Today',     items: [] },
    tomorrow: { key: 'tomorrow', label: 'Tomorrow',  items: [] },
    week:     { key: 'week',     label: 'This week', items: [] },
    later:    { key: 'later',    label: 'Later',     items: [] },
    someday:  { key: 'someday',  label: 'No date',   items: [] },
  }
  for (const t of tasks) {
    const when = t.remind_at || t.due_date
    if (!when) { buckets.someday.items.push(t); continue }
    const diff = Math.round((startOfDay(new Date(when)) - today) / day)
    if (diff < 0) buckets.overdue.items.push(t)
    else if (diff === 0) buckets.today.items.push(t)
    else if (diff === 1) buckets.tomorrow.items.push(t)
    else if (diff <= 7) buckets.week.items.push(t)
    else buckets.later.items.push(t)
  }
  return Object.values(buckets).filter(b => b.items.length)
}

const FIELDS = ['name', 'company', 'role', 'from_place', 'met_place', 'met_city',

function filterPeople(people, q) {
  const needle = q.trim().toLowerCase()
  if (!needle) return people
  // Every word has to appear somewhere, so "dubai roofing" narrows rather than widens.
  const words = needle.split(/\s+/)
  return people.filter(p => {
    const hay = FIELDS.map(f => (p[f] || '')).join(' ').toLowerCase()
    return words.every(w => hay.includes(w))
  })
}

const ROWS = [
  ['company', 'Business'], ['role', 'Role'], ['from_place', 'From'],
  ['met_place', 'Met at'], ['met_city', 'City'], ['met_country', 'Country'],
  ['met_date', 'Met on'], ['phone', 'Phone'], ['instagram', 'Instagram'],

async function openPerson(id) {
  const s = document.createElement('div')
  s.className = 'sheet'
  s.innerHTML = '<div class="inner tall"><div class="empty">Loading…</div></div>'
  document.body.appendChild(s)
  s.onclick = e => { if (e.target === s) s.remove() }

  const r = await call('/person/' + id)
  if (!r.ok) { s.querySelector('.inner').innerHTML = '<div class="empty">Could not load.</div>'; return }
  const { person: p, timeline } = await r.json()

  const detail = () =>
    '<div class="phead"><h2>' + esc(p.name) + '</h2>' +
      '<button class="closex" onclick="this.closest(\'.sheet\').remove()">&times;</button></div>' +
    '<div class="prows">' +
      ROWS.filter(f => p[f[0]]).map(f => {
        const v = f[0] === 'instagram' ? '@' + p[f[0]] : p[f[0]]
        const val = f[0] === 'phone'
          ? '<a href="tel:' + esc(p.phone) + '">' + esc(v) + '</a>'
          : f[0] === 'instagram'
            ? '<a href="https://instagram.com/' + esc(p.instagram) + '" target="_blank">' + esc(v) + '</a>'
            : esc(v)
        return '<div class="prow"><span class="k">' + f[1] + '</span><span class="v">' + val + '</span></div>'
      }).join('') +
    '</div>' +
    (timeline.length
      ? '<h4 class="tlh">Timeline</h4>' + timeline.map(i =>
          '<div class="tl"><div class="tld">' + fmt(i.date) + '</div>' +
          '<div>' + esc(i.note) + '</div></div>').join('')
      : '') +
    '<textarea id="pnote" placeholder="Say anything — a correction, or what just happened. ' +
      '&quot;His Instagram is rashid.almarri and he moved to Abu Dhabi&quot;"></textarea>' +
    '<button class="btn" id="psave">Add / update</button>'

  s.querySelector('.inner').innerHTML = detail()

  s.querySelector('#psave').onclick = async () => {
    const text = s.querySelector('#pnote').value.trim()
    if (!text) return
    s.querySelector('#psave').textContent = 'Working…'
    try {
      const rr = await call('/person/' + id + '/note', { method: 'POST', body: JSON.stringify({ text }) })
      const j = await rr.json()
      const changed = Object.keys(j.updates || {})
      s.querySelector('.inner').innerHTML =
        '<div class="filed">' +
          '<div class="tickbig"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" ' +
            'stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg></div>' +
          '<h3>' + esc(j.spoken || 'Saved.') + '</h3>' +
          (changed.length
            ? '<div class="meta">' + changed.map(k => '<span class="pill">' + esc(k.replace(/_/g, ' ')) + '</span>').join('') + '</div>'
            : '') +
        '</div>'
      setTimeout(() => { s.remove(); load() }, 1500)
    } catch (e) {
      s.querySelector('#psave').textContent = 'No connection — try again'
    }
  }
}

function render() {
  const q = $('netq'), caret = q ? q.selectionStart : null
  $('title').textContent = { todos: 'To-dos', thoughts: 'Thoughts', network: 'Network', inbox: 'Inbox' }[tab]
  $('view').innerHTML = loaded ? views[tab]()
    : '<div class="empty">Could not reach the server.<br>' +
      '<button class="btn" style="max-width:200px;margin:16px auto 0" onclick="load()">Try again</button></div>'
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab))

  const nq = $('netq')
  if (nq) {
    nq.oninput = e => { netQuery = e.target.value; render() }
    if (q) { nq.focus(); if (caret != null) nq.setSelectionRange(caret, caret) }
  }
}

async function load() {
  if (!TOKEN) return
  try {
    const r = await call('/data')
    if (r.status === 401) {
      const j = await r.json().catch(() => ({}))
      return lockOut(j.reason)
    }
    if (!r.ok) throw new Error('HTTP ' + r.status)
    D = await r.json()
    loaded = true
    const spent = D.usage ? Number(D.usage.cost_usd) : 0
    $('sp').textContent = spent ? '$' + spent.toFixed(2) + ' this month' : ''
  } catch (e) {
    loaded = false          // say so plainly instead of showing a convincing blank app
  }
  render()
}

async function done(id) {
  D.tasks = D.tasks.filter(t => t.id !== id); render()
  await call('/task/' + id + '/done', { method: 'POST' })
}
async function archive(id) {
  D.thoughts = D.thoughts.filter(t => t.id !== id); render()
  await call('/thought/' + id + '/archive', { method: 'POST' })
}

  s.querySelector('#send').onclick = async () => {

    s.querySelector('#send').textContent = 'Filing…'
    try {
      const r = await call('/capture', { method: 'POST', body: JSON.stringify({ text, source: 'app' }) })
      const j = await r.json()
      // Say where it went. Silently closing gives no way to notice a misroute.
      const where = { person: 'Network', interaction: 'Network', task: 'To-dos',
                      thought: 'Thoughts', finance: 'Finance' }

            'stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg></div>' +

          '<div class="meta">' + (j.filed || []).map(f =>
            '<span class="pill">' + esc(where[f.type] || f.type) + '</span>').join('') +
            (j.parser === 'rules' ? '<span class="pill warn">no AI</span>' : '') +

        '</div>'

// Lock / devices menu.
$('lockbtn').onclick = async () => {
  const r = await call('/auth/devices')
  const j = r.ok ? await r.json() : { devices: [] }
  const rows = j.devices.filter(d => !d.revoked_at).map(d =>
    '<div class="row" style="padding:9px 0;border-bottom:1px solid var(--border)">' +
      '<div class="grow"><b>' + esc(d.label || 'device') + (d.id === j.thisDevice ? ' (this one)' : '') +
      '</b><div class="meta">last used ' + fmt(d.last_seen_at) + '</div></div>' +
      (d.id === j.thisDevice ? '' :
        '<button class="pill warn" onclick="revoke(\'' + d.id + '\')">Sign out</button>') +
    '</div>').join('')
  const s = document.createElement('div')
  s.className = 'sheet'
  s.innerHTML = '<div class="inner"><h3 style="margin:0 0 10px">Devices</h3>' + rows +
    '<button class="btn ghost" id="chg">Change code</button>' +
    '<button class="btn ghost" id="lock">Lock this device now</button>' +
    '<button class="btn ghost" id="cancel">Close</button></div>'
  document.body.appendChild(s)
  s.querySelector('#cancel').onclick = () => s.remove()
  s.onclick = e => { if (e.target === s) s.remove() }
  s.querySelector('#lock').onclick = async () => {
    await call('/auth/lock', { method: 'POST' })
    s.remove(); lockOut('revoked')
  }
  s.querySelector('#chg').onclick = async () => {
    const oldCode = prompt('Current code')
    if (!oldCode) return
    const code = prompt('New code (4-12 digits)')
    if (!code) return
    const r = await call('/auth/set-code', { method: 'POST', body: JSON.stringify({ code, oldCode }) })
    const j = await r.json()
    alert(r.ok ? 'Code changed.' : (j.error || 'Could not change the code.'))
    if (r.ok) s.remove()
  }
}

async function revoke(id) {
  await call('/auth/devices/' + id + '/revoke', { method: 'POST' })
  alert('Signed out. That device needs the code again.')
}

async function boot() {
  await load()
  if (TOKEN) {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {})
    setInterval(load, 60000)
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load() })
  }
}

;(async () => {
  if (TOKEN) return boot()
  try {
    const r = await fetch(API + '/auth/status')
    const j = await r.json()
    showLock({ mode: j.codeSet ? 'unlock' : 'create' })
  } catch (e) {
    $('view').innerHTML = '<div class="empty">Could not reach the server.<br>Check your connection.</div>'
  }
})()
